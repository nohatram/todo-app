<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#f7f7f7" />
    <script>try { var t = localStorage.getItem('theme'), c = { dark: '#161616', crazy: '#999999' }[t]; if (c) { document.documentElement.dataset.theme = t; document.querySelector('meta[name=theme-color]').content = c } } catch (e) {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>List</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="List" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <button id="back" class="chip" hidden aria-label="Back one page"><kbd>esc</kbd>back</button>
        <nav id="path" class="path" aria-label="Where you are"></nav>
        <span id="status" role="status" aria-live="polite"></span>
        <button id="addimg" class="chip icon" aria-label="Add an image"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 12l3.5-4 2.5 3 1.5-1.5L13 12Z" fill="currentColor"/><circle cx="10.6" cy="6.2" r="1.1" fill="currentColor"/></svg></button>
        <input id="imgpick" type="file" accept="image/*" multiple hidden />
        <button id="theme" class="chip icon" aria-label="Switch to dark mode"></button>
        <button id="menu" class="chip">Settings</button>
        <div id="banner" class="banner" role="alert" hidden></div>
      </header>
      <main id="editor"></main>
    </div>

    <section id="settings" class="settings" hidden>
      <form id="settings-form">
        <h1>Connect your list</h1>
        <p>Your list lives in a private GitHub repo. This app reads and writes it with a token that only works on that repo.</p>
        <label>Repo<input id="repo" autocomplete="off" autocapitalize="off" spellcheck="false" required /></label>
        <label>Token<input id="token" type="password" autocomplete="off" required /></label>
        <label>Branch<input id="branch" autocomplete="off" autocapitalize="off" spellcheck="false" /></label>
        <p class="hint">Make one at github.com/settings/personal-access-tokens: fine-grained, only this repo, Contents set to read and write.</p>
        <p id="settings-error" class="error" role="alert"></p>
        <div class="row">
          <button type="submit" class="primary">Connect</button>
          <button type="button" id="cancel">Cancel</button>
        </div>
      </form>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
